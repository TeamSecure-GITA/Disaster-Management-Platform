safety_policy:
  strict_mode: true
  autonomous_execution_allowed:
    - "current_weather"
    - "weather_forecast"
    - "sensor_status"
    - "sensor_readings"
    - "incident_search"
    - "shelter_search"
    - "shelter_capacity"
    - "shelter_safety"
    - "responder_search"
    - "geocoding"
    - "routing"
    - "distance"
    - "dashboard"
    - "statistics"
    - "trends"
    - "ml_prediction"
    - "risk_prediction"

  human_confirmation_required:
    - "evacuation_order"
    - "responder_dispatch"
    - "responder_assignment"
    - "incident_creation"
    - "broadcast_alert"
    - "siren_activation"
    - "infrastructure_shutdown"

  confidence_thresholds:
    high_confidence_direct_answer: 0.85
    medium_confidence_clarify: 0.60
    low_confidence_fallback: 0.40

  hallucination_rules:
    disallow_unreferenced_casualty_counts: true
    disallow_unverified_safe_zones: true
    enforce_sop_citations: true
