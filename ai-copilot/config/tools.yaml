tools:
  prediction:
    - name: "ml_prediction"
      description: "Call ML inference engine for landslide, flood, cyclone or anomaly predictions"
    - name: "risk_prediction"
      description: "Compute localized risk scores combining hazard models with vulnerability metrics"
    - name: "hazard_prediction"
      description: "Assess high-level hazard severity levels for specified coordinates"

  weather:
    - name: "current_weather"
      description: "Fetch live temperature, precipitation, wind speed, and humidity"
    - name: "weather_forecast"
      description: "Retrieve 24-72h weather forecasts and cumulative rainfall projections"
    - name: "severe_weather"
      description: "Query active meteorological alerts, storm warnings, and cyclone paths"

  sensors:
    - name: "sensor_status"
      description: "Check operational status and battery of IoT telemetry stations"
    - name: "sensor_readings"
      description: "Fetch latest seismic, pore pressure, river gauge, or soil moisture telemetry"
    - name: "anomaly_detection"
      description: "Identify sudden spikes or telemetry deviations indicating sensor failure or hazard trigger"

  incidents:
    - name: "incident_search"
      description: "Search open or closed incidents by location, severity, or disaster type"
    - name: "incident_details"
      description: "Get full incident report including casualties, resources on scene, and chronology"
    - name: "incident_status"
      description: "Update or check current containment or triage status of an incident"
    - name: "incident_creation"
      description: "Log a new verified incident into the emergency dispatch registry"

  shelters:
    - name: "shelter_search"
      description: "Search active relief centers and emergency shelters within a radius"
    - name: "shelter_capacity"
      description: "Retrieve bed occupancy, food rations, and medical supply levels"
    - name: "shelter_safety"
      description: "Verify that the shelter structure itself is outside the active hazard inundation zone"
    - name: "shelter_distance"
      description: "Compute travel distance and transit time from affected zones to candidate shelters"

  responders:
    - name: "responder_search"
      description: "Find available search & rescue (SAR), medical, fire, or police units"
    - name: "responder_status"
      description: "Retrieve real-time GPS locations and unit operational readiness"
    - name: "responder_assignment"
      description: "Assign response personnel or equipment teams to a targeted incident"
    - name: "responder_dispatch"
      description: "Execute deployment order for first responder team dispatch"

  maps:
    - name: "geocoding"
      description: "Convert textual addresses or landmark names to lat/lon coordinates"
    - name: "routing"
      description: "Find optimal routes avoiding flooded roads, debris, and hazard perimeters"
    - name: "distance"
      description: "Calculate direct or network distance between two points"
    - name: "nearby"
      description: "Find critical facilities (hospitals, helipads, relief stations) near coordinates"
    - name: "hazard_map"
      description: "Generate GeoJSON polygon overlay representing simulated hazard impact zones"

  analytics:
    - name: "dashboard"
      description: "Fetch real-time situational dashboard overview for the command center"
    - name: "trends"
      description: "Analyze temporal patterns of sensor readings or incident reports"
    - name: "statistics"
      description: "Compute aggregate statistics on population affected, shelters open, units deployed"
    - name: "kpi"
      description: "Retrieve operational response time, triage efficiency, and containment rates"

  simulation:
    - name: "digital_twin"
      description: "Access digital twin state of city infrastructure and hydrological networks"
    - name: "scenario"
      description: "Run forward scenario with custom rainfall or breach parameters"
    - name: "what_if"
      description: "Simulate 'what if' interventions (e.g. dam sluice release, road closure)"
    - name: "evacuation"
      description: "Model crowd evacuation velocity, bottleneck congestion, and clearance times"
