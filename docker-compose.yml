version: "3.8"

networks:
  dmp-network:
    driver: bridge

services:
  # ── AI & ML Subsystem (FastAPI) ──────────────────────────
  ai-service:
    build:
      context: ./ml_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - ML_ENABLED=true
      - AI_ENABLED=true
    networks:
      dmp-network:
        aliases:
          - ai-service
          - ml_backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Backend Core API (Node.js / Express) ────────────────
  # Scalable stateless API replicas: cron jobs disabled via RUN_CRON_JOBS=false
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/disaster_management
      - AI_CHATBOT_URL=http://ai-service:8000
      - AUTO_START_ML=false
      - RUN_CRON_JOBS=false
    depends_on:
      ai-service:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - dmp-network
    volumes:
      - backend-logs:/app/logs
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ── Dedicated Cron & Alert Fanout Worker ─────────────────
  # Runs single-instance scheduled jobs & async alert queue
  cron_worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file:
      - ./Backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/disaster_management
      - AI_CHATBOT_URL=http://ai-service:8000
      - RUN_CRON_JOBS=true
      - AUTO_START_ML=false
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - dmp-network
    volumes:
      - backend-logs:/app/logs

  # ── Frontend Web App (Vite / React / PWA) ───────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5500:5500"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - dmp-network

  # ── MongoDB Database ─────────────────────────────────────
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - dmp-network
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Automated MongoDB Daily Backup Sidecar ───────────────
  mongo_backup:
    image: mongo:8
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - dmp-network
    volumes:
      - mongo-backups:/backups/mongodb
      - ./scripts/backup_mongodb.sh:/scripts/backup_mongodb.sh:ro
    environment:
      - MONGO_URI=mongodb://mongo:27017/disaster_management
      - BACKUP_DIR=/backups/mongodb
      - RETENTION_DAYS=7
    entrypoint: >
      /bin/sh -c '
        while true; do
          echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Running automated MongoDB backup...";
          /scripts/backup_mongodb.sh || true;
          echo "Next backup in 24 hours...";
          sleep 86400;
        done
      '

volumes:
  mongo-data:
  mongo-backups:
  backend-logs:
  backend-uploads:
