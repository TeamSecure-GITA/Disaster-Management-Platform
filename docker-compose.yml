version: "3.8"

services:
  # ── AI & ML Subsystem (FastAPI) ──────────────────────────
  ml_backend:
    build:
      context: ./ml_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - ML_ENABLED=true
      - AI_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Backend Core API (Node.js / Express) ────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/disaster_management
      - AI_CHATBOT_URL=http://ml_backend:8000
      - AUTO_START_ML=false
    depends_on:
      - ml_backend
      - mongo
    volumes:
      - backend-logs:/app/logs
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ── Frontend Web App (Vite / React / PWA) ───────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5500:5500"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

  # ── MongoDB Database ─────────────────────────────────────
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  backend-logs:
  backend-uploads:
