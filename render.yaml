services:
  - type: web
    name: disaster-management-api
    runtime: node
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_URL
        value: https://disaster-management-frontend.onrender.com

  - type: web
    name: disaster-management-frontend
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_URL
        value: https://disaster-management-api.onrender.com
