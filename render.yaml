services:
  # ── Unified Single-Service Deployment (Frontend + Backend + AI/ML) ────────
  - type: web
    name: Disaster-Management-Platform-Unified
    runtime: node
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && npm --prefix Backend install
    startCommand: node scripts/run_all.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        value: mongodb+srv://teamsecureproject_db_user:1ZUmjUV8dPgGD7dp@cluster0.0xz9hc6.mongodb.net/disaster_management?retryWrites=true&w=majority
      - key: JWT_SECRET
        value: 8f6b2d0e9c4a7b1d5e3f6a8c0d2b4e6f9a1c3e5d7b9f2a4c6e8d0b3f5a7c9e1
      - key: JWT_EXPIRES_IN
        value: 7d

  # ── AI / ML Subsystem (FastAPI / Scikit-Learn / Multi-Hazard Models) ──────
  - type: web
    name: Disaster-Management-Platform-ML
    runtime: python
    rootDir: ml_backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ML_ENABLED
        value: "true"
      - key: AI_ENABLED
        value: "true"
      - key: PREDICTION_ENABLED
        value: "true"
      - key: WEBSOCKET_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: CORS_ALLOW_CREDENTIALS
        value: "false"
      - key: GEMINI_API_KEY
        sync: false

  # ── Backend (Node.js / Express Core API) ─────────────────────────────────
  - type: web
    name: Disaster-Management-Platform-Backend
    runtime: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        value: mongodb+srv://teamsecureproject_db_user:1ZUmjUV8dPgGD7dp@cluster0.0xz9hc6.mongodb.net/disaster_management?retryWrites=true&w=majority
      - key: JWT_SECRET
        value: 8f6b2d0e9c4a7b1d5e3f6a8c0d2b4e6f9a1c3e5d7b9f2a4c6e8d0b3f5a7c9e1
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_CHATBOT_URL
        fromService:
          type: web
          name: Disaster-Management-Platform-ML
          property: host

  # ── Frontend (Vite / React / PWA) ─────────────────────────────────────────
  - type: web
    name: Disaster-Management-Platform-Frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
