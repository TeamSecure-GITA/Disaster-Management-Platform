version: '3.8'

services:
  ml_engine_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml_engine_api
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=production
      - MODEL_REGISTRY_PATH=/app/models/trained
      - LOG_LEVEL=INFO
      - WORKERS=4
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./configs:/app/configs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ml_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml_engine_worker
    command: python scripts/train_model.py --all
    environment:
      - ENVIRONMENT=production
      - MODEL_REGISTRY_PATH=/app/models/trained
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
    restart: on-failure
    depends_on:
      - ml_engine_api
