version: "1.0.0"
description: "Model Training and Hyperparameter Tuning Configuration"

global:
  random_state: 42
  test_size: 0.2
  stratify: true
  n_jobs: -1
  checkpoint_dir: "models/{hazard_type}/checkpoints"
  artifact_dir: "models/{hazard_type}/artifacts"

cross_validation:
  strategy: "stratified" # options: stratified, kfold, time_series
  n_splits: 5
  shuffle: true

models:
  landslide:
    model_name: "landslide_risk_model"
    hazard_type: "landslide"
    algorithm: "random_forest"
    target_column: "landslide_occurred"
    eval_metric: "f1"
    hyperparameters:
      n_estimators: 100
      max_depth: 12
      min_samples_split: 5
      min_samples_leaf: 2
      class_weight: "balanced"
      random_state: 42

  flood:
    model_name: "flood_hazard_model"
    hazard_type: "flood"
    algorithm: "gradient_boosting"
    target_column: "flood_alert_level"
    eval_metric: "f1"
    hyperparameters:
      n_estimators: 120
      learning_rate: 0.08
      max_depth: 6
      subsample: 0.85
      random_state: 42

  cyclone:
    model_name: "cyclone_intensity_model"
    hazard_type: "cyclone"
    algorithm: "random_forest"
    target_column: "cyclone_category"
    eval_metric: "f1"
    hyperparameters:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 4
      random_state: 42

  anomaly:
    model_name: "sensor_anomaly_detector"
    hazard_type: "anomaly"
    algorithm: "isolation_forest"
    target_column: "is_anomaly"
    eval_metric: "f1"
    hyperparameters:
      n_estimators: 100
      contamination: 0.05
      max_samples: "auto"
      random_state: 42

  forecasting:
    model_name: "environmental_forecasting_model"
    hazard_type: "forecasting"
    algorithm: "gradient_boosting"
    target_column: "target_value"
    eval_metric: "rmse"
    hyperparameters:
      n_estimators: 100
      learning_rate: 0.05
      max_depth: 5
      random_state: 42

  multi_hazard:
    model_name: "multi_hazard_risk_classifier"
    hazard_type: "multi_hazard"
    algorithm: "random_forest"
    target_column: "overall_risk_level"
    eval_metric: "f1"
    hyperparameters:
      n_estimators: 150
      max_depth: 14
      class_weight: "balanced"
      random_state: 42

tuning:
  search_type: "grid" # options: grid, random
  n_iter: 20
  scoring: "f1_weighted"
  grids:
    random_forest:
      n_estimators: [50, 100, 200]
      max_depth: [6, 10, 15, null]
      min_samples_split: [2, 5, 10]
    gradient_boosting:
      n_estimators: [80, 120, 200]
      learning_rate: [0.01, 0.05, 0.1]
      max_depth: [4, 6, 8]
    isolation_forest:
      n_estimators: [50, 100, 150]
      contamination: [0.01, 0.05, 0.10]
