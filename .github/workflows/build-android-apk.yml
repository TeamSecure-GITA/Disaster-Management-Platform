name: 🚀 Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_notes:
        description: 'Release notes / changelog'
        required: false
        default: 'New release of Disaster Sentinel Mobile'
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: 🔨 Build APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ─────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ─────────────────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Android SDK ──────────────────────────────────────
      - name: 📱 Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

      # ── 4. Node ─────────────────────────────────────────────
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      # ── 5. Install JS deps ──────────────────────────────────
      - name: 📦 Install JS dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      # ── 6. Expo prebuild → generates android/ folder ────────
      - name: ⚙️ Expo Prebuild (generate Android project)
        working-directory: mobile
        env:
          CI: '1'
          EXPO_PUBLIC_ENVIRONMENT: 'production'
          EXPO_PUBLIC_API_URL: 'https://disaster-management-platform-backend.onrender.com/api'
          EXPO_PUBLIC_ML_API_URL: 'https://disaster-management-platform-ml.onrender.com'
          EXPO_PUBLIC_WS_URL: 'wss://disaster-management-platform-backend.onrender.com'
        run: npx expo prebuild --platform android --clean

      # ── 7. Gradle build ─────────────────────────────────────
      - name: 🔨 Build APK with Gradle
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_ENVIRONMENT: 'production'
          EXPO_PUBLIC_API_URL: 'https://disaster-management-platform-backend.onrender.com/api'
          EXPO_PUBLIC_ML_API_URL: 'https://disaster-management-platform-ml.onrender.com'
          EXPO_PUBLIC_WS_URL: 'wss://disaster-management-platform-backend.onrender.com'
        run: |
          chmod +x gradlew
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      # ── 8. Find & rename APK ────────────────────────────────
      - name: 🔍 Locate and rename APK
        id: apk
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found after Gradle build"
            find mobile/android/app/build/outputs/ -type f 2>/dev/null || true
            exit 1
          fi
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "Found APK: $APK_PATH ($APK_SIZE)"
          cp "$APK_PATH" Disaster-Sentinel-Mobile.apk
          mkdir -p mobile
          cp "$APK_PATH" mobile/Disaster-Sentinel-Mobile.apk
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

      # ── 8b. Upload APK Artifact ─────────────────────────────
      - name: 💾 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Disaster-Sentinel-Mobile-APK
          path: Disaster-Sentinel-Mobile.apk
          if-no-files-found: error

      # ── 9. Determine tag ────────────────────────────────────
      - name: 🏷️ Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      # ── 10. Build release notes ─────────────────────────────
      - name: 📝 Generate release notes
        run: |
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="Automated build from commit \`${GITHUB_SHA::7}\`"
          fi
          cat > release_notes.md << MARKDOWN
          ## 📱 Disaster Sentinel Mobile — ${{ steps.tag.outputs.tag }}

          ${NOTES}

          ### 🔨 Build Details
          | Field | Value |
          |-------|-------|
          | Commit | \`${GITHUB_SHA::7}\` |
          | Branch | \`${GITHUB_REF_NAME}\` |
          | Build Type | \`${{ github.event.inputs.build_type || 'release' }}\` |
          | APK Size | ${{ steps.apk.outputs.apk_size }} |
          | Built at | $(date -u +'%Y-%m-%d %H:%M UTC') |

          ### 📲 Installation Instructions
          1. Download **Disaster-Sentinel-Mobile.apk** from Assets below
          2. Transfer to your Android device
          3. Go to **Settings → Security → Install unknown apps** and allow
          4. Open the APK file and tap **Install**
          MARKDOWN

      # ── 11. Publish GitHub Release ──────────────────────────
      - name: 🚀 Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Disaster Sentinel Mobile ${{ steps.tag.outputs.tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: Disaster-Sentinel-Mobile.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 12. Job Summary ─────────────────────────────────────
      - name: ✅ Job Summary
        run: |
          echo "## ✅ Release Published!" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK | Disaster-Sentinel-Mobile.apk (${{ steps.apk.outputs.apk_size }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${GITHUB_SHA::7}\` |" >> $GITHUB_STEP_SUMMARY
